name: Test
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      macos_runner:
        description: macOS runner (Intel by default; Apple Silicon available for explicit checks)
        type: choice
        default: macos-15-intel
        options:
          - macos-15-intel
          - macos-latest

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable-tools:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # macos-latest currently uses the capacity-constrained arm64 pool.
        # Keep macOS required; select Apple Silicon explicitly for additional checks.
        os: [ubuntu-latest, "${{ inputs.macos_runner || 'macos-15-intel' }}", windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - run: npm test
      - run: node scripts/privacy.mjs
      - run: node scripts/install.mjs
      - run: node scripts/verify.mjs
